<svg xmlns="http://www.w3.org/2000/svg" width="600" height="130" viewBox="0 0 600 130" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Contribution streaks">
  <title>Contribution streaks</title>
  <rect width="600" height="130" rx="10" fill="#1a1b27"/>
  <line x1="200" y1="28" x2="200" y2="102" stroke="#2f334d"/>
  <line x1="400" y1="28" x2="400" y2="102" stroke="#2f334d"/>
  <text x="100" y="64" text-anchor="middle" font-size="32" font-weight="700" fill="#7aa2f7">272</text>
  <text x="100" y="90" text-anchor="middle" font-size="13" fill="#a9b1d6">Total Contributions</text>
  <text x="100" y="108" text-anchor="middle" font-size="11" fill="#565f89">All time</text>
  <text x="300" y="64" text-anchor="middle" font-size="32" font-weight="700" fill="#ff9e64">2</text>
  <text x="300" y="90" text-anchor="middle" font-size="13" fill="#ff9e64">Current Streak</text>
  <text x="300" y="108" text-anchor="middle" font-size="11" fill="#565f89">5 Oct – 6 Oct</text>
  <text x="500" y="64" text-anchor="middle" font-size="32" font-weight="700" fill="#7aa2f7">5</text>
  <text x="500" y="90" text-anchor="middle" font-size="13" fill="#a9b1d6">Longest Streak</text>
  <text x="500" y="108" text-anchor="middle" font-size="11" fill="#565f89">3 Dec 2025 – 7 Dec 2025</text>
</svg>
